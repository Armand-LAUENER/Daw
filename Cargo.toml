[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
engine-dsp = { path = "crates/engine-dsp" }
cpal = "0.18.2"
rtrb = "0.4.0"
assert_no_alloc = "1.1.2"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
# Unoptimized DSP code is too slow to hold real-time deadlines.
opt-level = 1

[profile.release]
debug = true
