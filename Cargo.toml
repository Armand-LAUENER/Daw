[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
engine-core = { path = "crates/engine-core" }
engine-dsp = { path = "crates/engine-dsp" }
engine-io-file = { path = "crates/engine-io-file" }
engine-midi = { path = "crates/engine-midi" }
cpal = "0.18.2"
# default-features off: the default set pulls every decoder in, so each crate
# names the formats it actually wants.
symphonia = { version = "0.6.1", default-features = false }
rubato = "5.0.0"
# default-features off: the default set pulls rayon in to parse tracks in
# parallel, which is six crates for work measured in milliseconds, off the
# audio thread.
midly = { version = "0.5.3", default-features = false, features = ["std"] }
rtrb = "0.4.0"
assert_no_alloc = "1.1.2"
proptest = "1.11.0"

[workspace.lints.rust]
unsafe_code = "forbid"

[workspace.lints.clippy]
unwrap_used = "warn"

[profile.dev]
# Unoptimized DSP code is too slow to hold real-time deadlines.
opt-level = 1

[profile.release]
debug = true
