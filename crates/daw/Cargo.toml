[package]
name = "daw"
description = "The application: a window over the project, and the engine that plays it."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine-core.workspace = true
engine-dsp.workspace = true
engine-io.workspace = true
engine-io-file.workspace = true
engine-midi.workspace = true
project-engine.workspace = true
project-model.workspace = true
eframe = "0.36.2"

[features]
# WSLg and some Linux desktops expose sound through PulseAudio only. Chosen
# at run time with DAW_HOST=pulseaudio.
pulseaudio = ["engine-io/pulseaudio"]

[lints]
workspace = true
