[package]
name = "engine-io"
description = "Audio device I/O: cpal stream, real-time callback, control and diagnostics channels."
version.workspace = true
edition.workspace = true
license.workspace = true

[dependencies]
engine-dsp.workspace = true
cpal.workspace = true
rtrb.workspace = true
assert_no_alloc.workspace = true

[features]
# Native PulseAudio host (pure Rust client), selectable with `EngineOptions::host`.
pulseaudio = ["cpal/pulseaudio"]

[dev-dependencies]
proptest.workspace = true
# Only the phase1 example and the pipeline test play files; the library stays
# device-only, so the file layer never becomes a runtime dependency.
engine-io-file.workspace = true
# Same rule for the graph: the phase2 example wires it to the device, the
# library does not depend on it.
engine-core.workspace = true

[lints]
workspace = true

[[example]]
name = "phase2"
# Run the argument-parsing tests with `cargo test`.
test = true

[[example]]
name = "phase1"
# Run the argument-parsing tests with `cargo test`.
test = true

[[example]]
name = "phase0"
# Run the argument-parsing tests with `cargo test`.
test = true
